<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu, Location &amp; Payment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Look and feel matched to kounpyramids.com: Playfair Display headings, Inter body, Cairo for Arabic, navy accents. */
  :root {
    --bg:#ffffff; --card:#ffffff; --cream:#f7f5ef; --border:#e8e4d9;
    --text:#020817; --muted:#665a4c; --navy:#1e3a5f; --navy-dark:#0f1f35; --gold:#9a7b4f; --gold-light:#d4b07a;
    --serif:"Playfair Display","Cairo",Georgia,serif;
    --sans:"Inter","Cairo",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; font-family:var(--sans); background:var(--navy-dark);
         color:var(--text); -webkit-font-smoothing:antialiased; }
  /* Full-screen photo behind everything; a fixed layer instead of background-attachment, which iOS ignores. */
  .bg { position:fixed; inset:0; z-index:-1; background:url("images/background.jpg") center 35% / cover no-repeat; }
  .bg::after { content:""; position:absolute; inset:0;
               background:linear-gradient(180deg, rgba(15,31,53,.55) 0%, rgba(15,31,53,.15) 38%, rgba(2,8,23,.55) 75%, rgba(2,8,23,.8) 100%); }
  .hero { color:#fff; text-align:center; padding:44px 16px 24px; text-shadow:0 2px 18px rgba(2,8,23,.45); }
  .badge { display:inline-block; padding:6px 16px; border:1px solid rgba(255,255,255,.35); border-radius:999px;
           background:rgba(255,255,255,.12); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); text-shadow:none; font-size:.72rem; font-weight:600; letter-spacing:.2em; text-transform:uppercase; }
  h1 { font-family:var(--serif); font-weight:500; font-size:2.6rem; line-height:1.1; letter-spacing:-.02em; margin:18px 0 0; }
  .divider { width:72px; height:2px; margin:18px auto; background:rgba(255,255,255,.6); }
  .tagline { margin:0 auto; max-width:420px; font-weight:300; font-size:1.05rem; line-height:1.5; color:rgba(255,255,255,.9); }
  .table { display:inline-block; margin:18px 0 0; padding:6px 16px; border-radius:999px; background:#fff; color:var(--navy);
           font-size:.85rem; font-weight:600; text-shadow:none; }
  /* Push the buttons down so the pyramids stay visible between the title and the buttons. */
  main { flex:1; width:100%; max-width:480px; margin:0 auto; padding:clamp(40px, 22vh, 220px) 16px 32px; }
  .btn { display:flex; align-items:center; gap:16px; width:100%; margin-top:14px; padding:18px;
         background:rgba(255,255,255,.9); border:1px solid rgba(255,255,255,.6); border-radius:16px; box-shadow:0 10px 30px -12px rgba(2,8,23,.5);
         backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
         color:inherit; text-decoration:none; cursor:pointer; text-align:left; font-family:inherit; }
  .btn .icon { flex:none; display:grid; place-items:center; width:48px; height:48px; border-radius:12px; background:var(--cream); color:var(--navy); }
  .btn .label { flex:1; font-family:var(--serif); font-size:1.3rem; font-weight:700; }
  .btn small { display:block; margin-top:2px; font-family:var(--sans); font-weight:400; font-size:.85rem; color:var(--muted); }
  .btn .chev { color:var(--muted); flex:none; }
  svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
  .panel { margin-top:10px; background:rgba(255,255,255,.96); border:1px solid rgba(255,255,255,.6); border-radius:16px; padding:4px 18px 8px; }
  .panel[hidden] { display:none; }
  .panel ul { padding:0; margin:0; }
  .panel li { list-style:none; padding:14px 0; border-bottom:1px solid var(--border); }
  .panel li:last-child { border-bottom:0; }
  .panel a { color:var(--navy); font-weight:600; }
  .panel h3 { margin:18px 0 0; color:var(--navy); font-size:.75rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; }
  #menu.panel { background:none; border:0; padding:0; }
  .cat { position:relative; margin-top:14px; padding:120px 18px 8px; border-radius:16px; overflow:hidden; color:#fff;
         background:#0b0f17 center top / 100% auto no-repeat; box-shadow:0 10px 30px -12px rgba(2,8,23,.6); scroll-margin-top:64px; }
  .cat::before { content:""; position:absolute; inset:0;
                 background:linear-gradient(180deg, rgba(5,8,15,.1) 0, rgba(5,8,15,.35) 140px, rgba(5,8,15,.72) 300px, rgba(5,8,15,.82) 100%); }
  .cat > * { position:relative; }
  .cat.no-photo { padding-top:28px; background:linear-gradient(160deg, var(--navy-dark), #05080f); }
  .panel .cat h3 { margin:0; text-align:center; color:#fff; font-family:var(--serif); font-size:2rem; font-weight:700;
                   letter-spacing:.06em; text-transform:uppercase; text-shadow:0 2px 12px rgba(0,0,0,.5); }
  .cat-rule { width:56px; height:2px; margin:10px auto 6px; background:var(--gold-light); }
  .panel .cat li { border-bottom-color:rgba(255,255,255,.14); }
  .item { display:flex; align-items:flex-start; gap:12px; }
  .item > div { flex:1; }
  .item strong { font-weight:700; color:var(--gold-light); text-transform:uppercase; letter-spacing:.03em; }
  .item .desc { display:block; margin-top:4px; color:rgba(255,255,255,.88); font-size:.85rem; line-height:1.45; }
  .item .price { font-weight:700; font-size:1.05rem; color:var(--gold-light); white-space:nowrap; }
  .item.soldout { opacity:.5; }
  .item.soldout .price::after { content:" · Sold out"; font-weight:400; }
  .premium { margin-left:6px; font-family:var(--serif); font-style:italic; font-weight:500; font-size:.95rem; color:#fff; }
  .allergens { display:inline-flex; gap:3px; margin-left:6px; vertical-align:-3px; color:var(--gold-light); }
  .allergens svg, .legend svg { width:17px; height:17px; stroke-width:1.6; }
  .legend { margin:10px 0 0; padding:12px 14px; border-radius:12px; background:var(--cream); font-size:.82rem; color:var(--muted); }
  .legend p { margin:0 0 8px; color:var(--text); font-weight:500; }
  .legend span { display:inline-flex; align-items:center; gap:4px; margin:0 12px 4px 0; }
  .legend svg { color:var(--gold); }
  .chips { position:sticky; top:0; z-index:2; display:flex; gap:8px; overflow-x:auto; margin:10px -16px 0; padding:10px 16px;
           background:rgba(15,31,53,.55); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chips a { flex:none; padding:7px 14px; border:1px solid var(--border); border-radius:999px; background:#fff;
             color:var(--navy); font-size:.8rem; font-weight:500; text-decoration:none; }
  .menu-note { margin:16px 0 4px; text-align:center; font-size:.85rem; font-weight:500; color:rgba(255,255,255,.9); }
  #payList small { color:var(--muted); }
  .copy { margin-left:8px; padding:5px 12px; border:1px solid var(--navy); border-radius:8px;
          background:none; color:var(--navy); font:inherit; font-size:.8rem; font-weight:500; cursor:pointer; }
  .copy-value { display:block; margin-top:6px; font-variant-numeric:tabular-nums; }
  footer { color:rgba(255,255,255,.85); text-align:center; padding:18px 16px 28px; font-size:.9rem; }
  footer:empty { display:none; }
  footer a { color:#fff; font-weight:600; text-decoration:none; border-bottom:1px solid rgba(255,255,255,.5); }
</style>
</head>
<body>
<div class="bg"></div>
<header class="hero">
  <span class="badge">Welcome</span>
  <h1 id="name">Loading…</h1>
  <div class="divider"></div>
  <p class="tagline" id="tagline"></p>
  <p class="table" id="table" hidden></p>
</header>
<main>
  <button class="btn" id="menuBtn" type="button">
    <span class="icon"><svg viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg></span>
    <span class="label">Menu<small>See our dishes &amp; prices</small></span>
    <svg class="chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <section class="panel" id="menu" hidden></section>
  <a class="btn" id="mapBtn" href="#" target="_blank" rel="noopener">
    <span class="icon"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></span>
    <span class="label">Location<small>Click to open location via Google Maps</small></span>
    <svg class="chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
  </a>
  <button class="btn" id="payBtn" type="button">
    <span class="icon"><svg viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/></svg></span>
    <span class="label">Payments<small>InstaPay</small></span>
    <svg class="chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <section class="panel" id="pay" hidden><ul id="payList"></ul></section>
</main>
<footer id="footer"></footer>
<script>
  const params = new URLSearchParams(location.search);
  const table = params.get("t");
  const go = params.get("go");

  const ALLERGENS = { gluten: "Gluten", milk: "Milk & dairy", egg: "Egg", fish: "Fish & seafood" };
  const ICONS = {
    gluten: '<svg viewBox="0 0 24 24"><path d="M12 22V7"/><path d="M12 7c0-2.5 1-4 0-5-1 1 0 2.5 0 5z"/><path d="M12 12c-2.5 0-4-1.5-4.5-3.5 2.5 0 4 1.5 4.5 3.5zm0 0c2.5 0 4-1.5 4.5-3.5-2.5 0-4 1.5-4.5 3.5z"/><path d="M12 17c-2.5 0-4-1.5-4.5-3.5 2.5 0 4 1.5 4.5 3.5zm0 0c2.5 0 4-1.5 4.5-3.5-2.5 0-4 1.5-4.5 3.5z"/></svg>',
    milk: '<svg viewBox="0 0 24 24"><path d="M9.5 2h5M10 2v3.5L8 8.5V20a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V8.5l-2-3V2"/><path d="M8 12.5h8"/></svg>',
    egg: '<svg viewBox="0 0 24 24"><path d="M12 22c-3.9 0-7-2.9-7-7.2C5 9.3 8 2 12 2s7 7.3 7 12.8c0 4.3-3.1 7.2-7 7.2z"/></svg>',
    fish: '<svg viewBox="0 0 24 24"><path d="M2.5 12c2.6-4.2 8.1-5.6 12.6-2.6L20.5 6v12l-5.4-3.4C10.6 17.6 5.1 16.2 2.5 12z"/><circle cx="7.5" cy="11.3" r=".9" fill="currentColor"/></svg>',
  };

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // Cache-busting query so menu edits from the admin panel show up quickly.
  fetch("restaurant.json?v=" + Date.now(), { cache: "no-store" }).then(r => r.json()).then(c => {
    if (go === "location") return location.replace(c.location.maps_url);

    document.title = c.name;
    document.getElementById("name").textContent = c.name;
    document.getElementById("tagline").textContent = c.tagline || "";
    if (table) {
      const t = document.getElementById("table");
      t.textContent = "Table " + table;
      t.hidden = false;
    }
    document.getElementById("mapBtn").href = c.location.maps_url;

    const menu = document.getElementById("menu");
    const cats = c.menu.categories;

    // Category shortcuts, then the allergen key, then the items.
    const chips = el("nav", "chips");
    cats.forEach((cat, i) => {
      const a = el("a", null, cat.name);
      a.href = "#cat-" + i;
      chips.append(a);
    });
    const legend = el("div", "legend");
    legend.append(el("p", null, "If you have food allergies, please inquire before ordering."));
    for (const [key, label] of Object.entries(ALLERGENS)) {
      const span = el("span");
      span.innerHTML = ICONS[key];
      span.append(label);
      legend.append(span);
    }
    menu.append(chips, legend);

    // Each category is a card with its own food photo behind the items.
    cats.forEach((cat, i) => {
      const sec = el("section", cat.photo ? "cat" : "cat no-photo");
      sec.id = "cat-" + i;
      if (cat.photo) sec.style.backgroundImage = `url(${JSON.stringify(cat.photo)})`;
      sec.append(el("h3", null, cat.name), el("div", "cat-rule"));
      const ul = el("ul");
      for (const item of cat.items) {
        const li = el("li", "item" + (item.available === false ? " soldout" : ""));
        const left = el("div");
        left.append(el("strong", null, item.name));
        if (item.premium) left.append(el("span", "premium", "Premium"));
        if (item.allergens && item.allergens.length) {
          const icons = el("span", "allergens");
          icons.innerHTML = item.allergens.map(a => ICONS[a] || "").join("");
          icons.title = item.allergens.map(a => ALLERGENS[a]).join(", ");
          left.append(icons);
        }
        if (item.description) left.append(el("span", "desc", item.description));
        li.append(left, el("span", "price", item.price + " " + (c.currency || "")));
        ul.append(li);
      }
      sec.append(ul);
      menu.append(sec);
    });
    if (c.menu.note) menu.append(el("p", "menu-note", c.menu.note));

    const list = document.getElementById("payList");
    for (const m of c.payment_methods) {
      const li = el("li");
      const title = el(m.url ? "a" : "strong", null, m.name);
      // Payment links (e.g. InstaPay) open in the same tab so the phone can hand them to the app.
      if (m.url) title.href = m.url;
      li.append(title);
      if (m.note) li.append(el("small", null, " — " + m.note));
      if (m.copy) {
        const value = el("span", "copy-value", m.copy);
        const btn = el("button", "copy", "Copy");
        btn.type = "button";
        btn.onclick = () => navigator.clipboard.writeText(m.copy).then(
          () => { btn.textContent = "Copied ✓"; setTimeout(() => { btn.textContent = "Copy"; }, 2000); },
          () => { btn.textContent = "Select & copy"; });
        value.append(btn);
        li.append(value);
      }
      list.append(li);
    }

    const pay = document.getElementById("pay");
    document.getElementById("menuBtn").onclick = () => { menu.hidden = !menu.hidden; };
    document.getElementById("payBtn").onclick = () => { pay.hidden = !pay.hidden; };
    if (go === "menu") { menu.hidden = false; menu.scrollIntoView(); }
    if (go === "pay") { pay.hidden = false; pay.scrollIntoView(); }

    if (c.phone) {
      const call = el("a", null, c.phone);
      call.href = "tel:" + c.phone.replace(/[^+\d]/g, "");
      document.getElementById("footer").append("Need help? Call ", call);
    }
  });
</script>
</body>
</html>

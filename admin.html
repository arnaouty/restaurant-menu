<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Restaurant Admin</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#222; --muted:#666; --accent:#c0392b; --line:#e3e3e3; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:820px; margin:0 auto; padding:24px 16px 120px; }
  h1 { margin:0 0 16px; }
  h2 { margin:0 0 12px; font-size:1.2rem; }
  section, .card { background:var(--card); border-radius:12px; padding:18px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:10px; }
  input[type=text], input[type=number], input[type=url], input[type=password], textarea {
    display:block; width:100%; margin-top:4px; padding:9px 10px; font:inherit; color:var(--text);
    border:1px solid var(--line); border-radius:8px; background:#fff; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:0 14px; }
  .row { border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; }
  .row .grid { align-items:end; }
  .category { border:2px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  button.danger { color:var(--accent); }
  .check { display:flex; align-items:center; gap:6px; color:var(--text); }
  .savebar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line);
             padding:12px 16px; display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; }
  #status { color:var(--muted); }
  .hint { color:var(--muted); font-size:.85rem; margin:0 0 12px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Restaurant Admin</h1>

  <form class="card" id="login">
    <h2>Sign in with GitHub</h2>
    <p class="hint">Saving updates <code>restaurant.json</code> in your GitHub repository. The live site updates a minute or two later.
      Create a <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">fine-grained token</a>
      that can only reach this repository, with <b>Contents: Read and write</b>.</p>
    <div class="grid">
      <label>Repository owner<input type="text" id="owner" required></label>
      <label>Repository name<input type="text" id="repo" required></label>
      <label>Branch<input type="text" id="branch" value="main" required></label>
    </div>
    <label>Access token<input type="password" id="token" required autocomplete="off"></label>
    <label class="check"><input type="checkbox" id="remember"> Remember me on this device</label>
    <div class="actions"><button class="primary" type="submit">Load</button></div>
    <p id="loginError" style="color:var(--accent)"></p>
  </form>

  <div id="editor" hidden>
    <section id="general"></section>
    <section id="payments"></section>
    <section id="menu"></section>
  </div>
</main>

<div class="savebar" id="savebar" hidden>
  <span id="status">No changes</span>
  <a id="viewSite" href="index.html" target="_blank" rel="noopener">View site</a>
  <button type="button" id="logout">Sign out</button>
  <button class="primary" type="button" id="save">Save changes</button>
</div>

<script>
  const FILE = "restaurant.json";
  let auth = null;   // { owner, repo, branch, token }
  let sha = null;    // current file version, required by GitHub to update it
  let data = null;   // the restaurant config being edited

  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  // ---------- GitHub API ----------
  function api(method, body) {
    const url = `https://api.github.com/repos/${auth.owner}/${auth.repo}/contents/${FILE}` +
      (method === "GET" ? `?ref=${encodeURIComponent(auth.branch)}` : "");
    return fetch(url, {
      method,
      cache: "no-store",
      headers: { Authorization: `Bearer ${auth.token}`, Accept: "application/vnd.github+json" },
      body: body && JSON.stringify(body),
    }).then(async r => {
      const json = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(json.message || `GitHub error ${r.status}`);
      return json;
    });
  }
  const toBase64 = str => {
    const bytes = new TextEncoder().encode(str);
    let bin = "";
    for (const b of bytes) bin += String.fromCharCode(b);
    return btoa(bin);
  };
  const fromBase64 = b64 =>
    new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, "")), c => c.charCodeAt(0)));

  async function load() {
    const file = await api("GET");
    sha = file.sha;
    data = JSON.parse(fromBase64(file.content));
    data.location ??= { address: "", maps_url: "" };
    data.payment_methods ??= [];
    data.menu ??= { categories: [] };
    render();
    setDirty(false);
    $("login").hidden = true;
    $("editor").hidden = false;
    $("savebar").hidden = false;
  }

  async function save() {
    $("save").disabled = true;
    $("status").textContent = "Saving…";
    try {
      const res = await api("PUT", {
        message: "Update restaurant info from admin panel",
        content: toBase64(JSON.stringify(data, null, 2) + "\n"),
        sha,
        branch: auth.branch,
      });
      sha = res.content.sha;
      setDirty(false);
      $("status").textContent = "Saved ✓ The live site updates in 1–2 minutes";
    } catch (e) {
      $("status").textContent = "Save failed: " + e.message +
        (/does not match/.test(e.message) ? " (the file changed elsewhere; reload the page)" : "");
    } finally {
      $("save").disabled = false;
    }
  }

  // ---------- Form helpers ----------
  let dirty = false;
  function setDirty(v) {
    dirty = v;
    $("status").textContent = v ? "Unsaved changes" : "No changes";
  }
  window.addEventListener("beforeunload", e => { if (dirty) e.preventDefault(); });

  function h(tag, attrs = {}, ...children) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else if (k === "class") e.className = v;
      else e[k] = v;
    }
    e.append(...children);
    return e;
  }

  // An input bound to obj[key].
  function field(label, obj, key, type = "text", extra = {}) {
    const input = h(type === "textarea" ? "textarea" : "input", { type, ...extra });
    input.value = obj[key] ?? "";
    input.addEventListener("input", () => {
      obj[key] = type === "number" ? (input.value === "" ? 0 : Number(input.value)) : input.value;
      setDirty(true);
    });
    return h("label", {}, label, input);
  }

  function checkbox(label, obj, key) {
    const input = h("input", { type: "checkbox", checked: obj[key] !== false });
    input.addEventListener("change", () => { obj[key] = input.checked; setDirty(true); });
    return h("label", { class: "check" }, input, label);
  }

  // Remove / move-up / move-down buttons for an item in an array.
  function listButtons(arr, i, what) {
    const change = fn => () => { fn(); setDirty(true); render(); };
    return h("div", { class: "actions" },
      h("button", { type: "button", title: "Move up", disabled: i === 0,
        onclick: change(() => arr.splice(i - 1, 0, arr.splice(i, 1)[0])) }, "↑"),
      h("button", { type: "button", title: "Move down", disabled: i === arr.length - 1,
        onclick: change(() => arr.splice(i + 1, 0, arr.splice(i, 1)[0])) }, "↓"),
      h("button", { type: "button", class: "danger",
        onclick: () => { if (confirm(`Delete this ${what}?`)) change(() => arr.splice(i, 1))(); } }, "Delete"));
  }

  function addButton(text, fn) {
    return h("button", { type: "button", onclick: () => { fn(); setDirty(true); render(); } }, "+ " + text);
  }

  // ---------- Sections ----------
  function render() {
    $("general").replaceChildren(
      h("h2", {}, "General"),
      h("div", { class: "grid" },
        field("Restaurant name", data, "name"),
        field("Phone", data, "phone"),
        field("Currency", data, "currency"),
        field("Number of tables", data, "tables", "number", { min: 1 })),
      field("Tagline", data, "tagline"),
      h("div", { class: "grid" },
        field("Address", data.location, "address"),
        field("Google Maps link", data.location, "maps_url", "url")),
      field("Site URL (used in QR codes)", data, "base_url", "url"),
      h("p", { class: "hint" }, "If you change the site URL or the number of tables, run generate_qr.py again and reprint the cards."));

    $("payments").replaceChildren(
      h("h2", {}, "Payment methods"),
      ...data.payment_methods.map((m, i) => h("div", { class: "row" },
        h("div", { class: "grid" },
          field("Name", m, "name"),
          field("Note", m, "note"),
          field("Payment link (optional)", m, "url", "url")),
        listButtons(data.payment_methods, i, "payment method"))),
      addButton("Add payment method", () => data.payment_methods.push({ name: "", note: "", url: "" })));

    const cats = data.menu.categories;
    $("menu").replaceChildren(
      h("h2", {}, "Menu"),
      ...cats.map((cat, ci) => h("div", { class: "category" },
        h("div", { class: "grid" }, field("Category name", cat, "name")),
        listButtons(cats, ci, "category and all its items"),
        h("p"),
        ...cat.items.map((item, ii) => h("div", { class: "row" },
          h("div", { class: "grid" },
            field("Item name", item, "name"),
            field(`Price (${data.currency || ""})`, item, "price", "number", { min: 0, step: "any" })),
          field("Description", item, "description"),
          checkbox("Available (untick to show as sold out)", item, "available"),
          listButtons(cat.items, ii, "item"))),
        addButton("Add item", () => cat.items.push({ name: "", description: "", price: 0, available: true })))),
      addButton("Add category", () => cats.push({ name: "", items: [] })));
  }

  // ---------- Login ----------
  // On GitHub Pages (owner.github.io/repo/) the repository can be guessed from the URL.
  if (location.hostname.endsWith(".github.io")) {
    $("owner").value = location.hostname.split(".")[0];
    $("repo").value = location.pathname.split("/")[1] || "";
  }
  const saved = JSON.parse(store.get("admin-auth") || "null");
  if (saved) {
    $("owner").value = saved.owner; $("repo").value = saved.repo;
    $("branch").value = saved.branch; $("token").value = saved.token;
    $("remember").checked = true;
  }

  $("login").addEventListener("submit", async e => {
    e.preventDefault();
    auth = { owner: $("owner").value.trim(), repo: $("repo").value.trim(),
             branch: $("branch").value.trim(), token: $("token").value.trim() };
    $("loginError").textContent = "Loading…";
    try {
      await load();
      $("loginError").textContent = "";
      if ($("remember").checked) store.set("admin-auth", JSON.stringify(auth));
      else store.del("admin-auth");
    } catch (err) {
      $("loginError").textContent = "Could not load: " + err.message;
    }
  });

  $("save").addEventListener("click", save);
  $("logout").addEventListener("click", () => {
    if (dirty && !confirm("Discard unsaved changes?")) return;
    store.del("admin-auth");
    dirty = false;
    location.reload();
  });
</script>
</body>
</html>
